<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAMRYA — 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --ink:#17340a; --ink-75:rgba(23,52,4,.75); --ink-50:rgba(23,52,4,.5);
  --ink-30:rgba(23,52,4,.3); --line:rgba(23,52,4,.12); --line-soft:rgba(23,52,4,.07);
  --moss:#639922; --moss-deep:#3b6d11; --cream:#faeeda; --leaf:#eaf3de; --wall:#eef3e4;
}
*{ box-sizing:border-box }
body{
  margin:0; background:var(--wall); color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;
  font-size:13px; line-height:1.6;
}
.wrap{ max-width:940px; margin:0 auto; padding:24px 18px 120px }
h1{ font-size:19px; margin:0 0 4px; letter-spacing:.04em }
.lead{ color:var(--ink-50); font-size:12px; margin:0 0 22px }
.card{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:14px }
.card > h2{ font-size:14px; margin:0 0 3px }
.card > .hint{ font-size:12px; color:var(--ink-30); margin:0 0 14px }
.grid{ display:grid; gap:10px }
.g2{ grid-template-columns:repeat(2,minmax(0,1fr)) }
.g3{ grid-template-columns:repeat(3,minmax(0,1fr)) }
.g4{ grid-template-columns:repeat(4,minmax(0,1fr)) }
@media(max-width:640px){ .g2,.g3,.g4{ grid-template-columns:1fr } }
label{ display:block; font-size:12px; color:var(--ink-50); margin-bottom:4px }
input,textarea,select{
  width:100%; font:inherit; font-size:13px; color:var(--ink);
  border:1px solid var(--line); border-radius:7px; padding:7px 10px; background:#fff;
}
textarea{ resize:vertical; min-height:70px; line-height:1.7 }
input:focus,textarea:focus,select:focus{ outline:2px solid var(--moss); outline-offset:-1px; border-color:transparent }
.rowbox{ border:1px solid var(--line-soft); border-radius:9px; padding:11px; margin-bottom:8px; background:#fcfdfa }
.rowtop{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px }
.rownum{ font-size:12px; color:var(--ink-30) }
.btn{ border:1px solid var(--line); background:#fff; border-radius:7px; padding:6px 12px; font:inherit; font-size:12px; cursor:pointer; color:var(--ink-75) }
.btn:hover{ border-color:var(--moss); color:var(--moss-deep) }
.btn--add{ width:100%; border-style:dashed; color:var(--ink-50) }
.btn--del{ color:#a33; border-color:transparent; padding:4px 8px }
.bar{
  position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line);
  padding:12px 18px; display:flex; align-items:center; gap:10px; justify-content:center; flex-wrap:wrap;
}
.btn--go{ background:var(--moss); border-color:var(--moss); color:#fff; padding:9px 20px; font-size:13px }
.btn--go:hover{ background:var(--moss-deep); color:#fff }
.msg{ font-size:12px; color:var(--moss-deep) }
.steps{ background:var(--leaf); border-radius:10px; padding:12px 16px; font-size:12px; color:var(--ink-75); margin-bottom:18px }
.steps b{ font-weight:600 }
.steps ol{ margin:6px 0 0; padding-left:18px }
</style>
</head>
<body>
<div class="wrap">
  <h1>MAMRYA 관리자</h1>
  <p class="lead">여기서 고친 뒤 아래 <b>data.js 내려받기</b>를 누르고, 받은 파일을 GitHub의 assets/js 폴더에 덮어쓰면 사이트에 반영됩니다.</p>

  <div class="steps">
    <b>사진과 음악은 파일을 먼저 올려야 합니다</b>
    <ol>
      <li>GitHub에서 assets/img (또는 assets/music) 폴더로 들어갑니다</li>
      <li>Add file → Upload files 로 파일을 올립니다</li>
      <li>여기 경로 칸에 <code>assets/img/파일이름.jpg</code> 처럼 적습니다</li>
    </ol>
  </div>

  <div id="form"></div>
</div>

<div class="bar">
  <button class="btn" id="loadBtn" type="button">지금 사이트 내용 불러오기</button>
  <button class="btn btn--go" id="saveBtn" type="button">data.js 내려받기</button>
  <span class="msg" id="msg"></span>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
